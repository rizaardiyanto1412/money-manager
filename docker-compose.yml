services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moneymanager}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moneymanager}
      POSTGRES_DB: ${POSTGRES_DB:-moneymanager}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-moneymanager}:${POSTGRES_PASSWORD:-moneymanager}@postgres:5432/${POSTGRES_DB:-moneymanager}
      API_PORT: 8787
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  mcp:
    build:
      context: .
      dockerfile: apps/mcp/Dockerfile
    env_file: .env
    environment:
      MONEY_MANAGER_API_URL: http://api:8787
      MCP_PORT: 8788
    ports:
      - "8788:8788"
    depends_on:
      - api

volumes:
  pgdata:
